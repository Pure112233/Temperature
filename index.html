<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Temperature Calculator</title>
</head>


<body>
    
    <!-- Head -->
    <div class="head">
        <h1>Temperature Calculator</h1>
    </div>
    <!-- Head -->

    <!-- Main -->
    <div class="mainbox">

        <!-- Celcius -->
        <h3>กรอกอุณหภูมิเซลเซียส [Celsius]</h3><br>
        <input type="number" placeholder="Celcius" id="inputcelsius"><br><br>
        <button onclick="ctof()">แปลงเป็นฟาเรนไฮต์</button>

        <div id="farenheitresultbox">
            <p id="resultfarenheit"></p>
        </div>

        <!-- fahrenheit -->
        <h3>กรอกอุณหภูมิฟาเรนไฮต์ (Fahrenheit)</h3><br>
        <input type="number" placeholder="Fahrenheit" id="inputfahrenheit"><br><br>
        <button onclick="ftoc()">แปลงเป็นเซลเซียส</button>

        <div id="celsiusresultbox">
            <p id="resultcelsius"></p>
        </div>

    </div>
    <!-- Main -->

    <script src="app.js"></script>
</body>


</html>
